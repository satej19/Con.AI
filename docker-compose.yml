services:
  mongodb:
    image: mongo:7
    container_name: material-mgmt-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: material_mgmt
    networks:
      - material-mgmt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: material-mgmt-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/material_mgmt
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      CORS_ORIGIN: http://localhost:5174,http://127.0.0.1:5174
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      - mongodb
    networks:
      - material-mgmt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: material-mgmt-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - material-mgmt-network

volumes:
  mongodb_data:

networks:
  material-mgmt-network:
    driver: bridge
